[project]
name = "sentinelflow"
version = "1.0.0"
description = "Hybrid rule + ML network threat detection mapped to MITRE ATT&CK"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3"]

[project.scripts]
sentinelflow = "sentinelflow.cli:main"

[tool.setuptools]
packages = ["sentinelflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
